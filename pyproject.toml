[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# Kept byte-identical to the blind-test run: experiments/intent_benchmark_v2.py --report checks src/ hashes.
"src/condition_audit.py" = ["F401"]
